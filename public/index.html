<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Find Your Ikigai</title>
  <meta name="description" content="Fifteen questions through the four circles of Ikigai — what you love, what you're good at, what the world needs and what you can be paid for — and a personal map of your reason for being.">
  <meta name="theme-color" content="#0d0b1a">
  <meta property="og:title" content="Find Your Ikigai">
  <meta property="og:description" content="Four circles. Fifteen questions. One reason for being.">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,400;1,9..144,500&family=Manrope:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@500&display=swap&text=%E7%94%9F%E3%81%8D%E7%94%B2%E6%96%90%E5%A5%BD%E5%BE%97%E4%B8%96%E7%A8%BC%E3%81%AA%E3%81%93%E3%81%A8%E6%84%8F%E7%95%8C%E3%81%8C%E5%BF%85%E8%A6%81%E3%81%99%E3%82%8B%E3%81%92">
  <link rel="stylesheet" href="/css/styles.css">
  <script type="module" src="/js/app.js"></script>
</head>
<body data-phase="landing">
  <div class="sky" aria-hidden="true">
    <div class="orb orb-love"></div>
    <div class="orb orb-good"></div>
    <div class="orb orb-needs"></div>
    <div class="orb orb-paid"></div>
    <div class="stars"></div>
    <div class="grain"></div>
  </div>

  <header class="topbar">
    <a class="brand" href="/" aria-label="Ikigai home">
      <span class="brand-jp" lang="ja">生き甲斐</span>
      <span class="brand-en">Ikigai</span>
    </a>
    <div class="progress" id="progress" hidden>
      <svg class="mini-venn" viewBox="0 0 48 48" aria-hidden="true">
        <circle data-c="love" cx="24" cy="15" r="10"/>
        <circle data-c="good" cx="15" cy="24" r="10"/>
        <circle data-c="needs" cx="33" cy="24" r="10"/>
        <circle data-c="paid" cx="24" cy="33" r="10"/>
      </svg>
      <div class="progress-text">
        <span class="progress-circle" id="progress-circle"></span>
        <span class="progress-count" id="progress-count"></span>
      </div>
      <div class="progress-bar"><span id="progress-fill"></span></div>
    </div>
  </header>

  <main id="stage" class="stage" tabindex="-1">
    <noscript><p class="noscript">This experience needs JavaScript turned on.</p></noscript>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</body>
</html>

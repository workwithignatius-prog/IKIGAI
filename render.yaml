# Render Blueprint — https://render.com/docs/blueprint-spec
# Deploy: https://render.com/deploy?repo=https://github.com/workwithignatius-prog/ikigai
services:
  - type: web
    name: ikigai
    runtime: node
    plan: starter            # a persistent disk requires a paid instance type
    branch: main
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DB_FILE
        value: /var/data/ikigai.db
      - key: ADMIN_TOKEN       # password for /admin — find it under the service's Environment tab
        generateValue: true
      - key: ANTHROPIC_API_KEY # turns on the Claude cognitive engine; leave empty for rules only
        sync: false
    disk:
      name: ikigai-data
      mountPath: /var/data
      sizeGB: 1
